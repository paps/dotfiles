# Setting the prefix from C-b to C-q
set-option -g prefix C-q

# Free the original Ctrl-b prefix keybinding
unbind-key C-b

# Ensure that we can send Ctrl-q to other apps
bind-key C-q send-prefix

#setting the delay between prefix and command
set-option -g escape-time 1

# Forward terminal focus in/out events to programs in panes (e.g. Vim autoread/FocusGained)
set-option -g focus-events on

# Alert when a background window rings
# bell-action: any = all windows, none = no alerts, current = selected window only,
# other = background windows only.
set-option -g bell-action any
set-option -g monitor-bell on # Track bells so the status bar can show a notification dot
# visual-bell: off = send a bell to the terminal (sound/flash depends on its settings),
# on = show a tmux message instead, both = send a bell AND show the message.
# This controls the alert, not the window's notification dot in the status bar.
set-option -g visual-bell off
set-option -g window-status-bell-style default # Keep normal styling; the dot below marks bells

# Keep ordinary output from triggering alerts
set-option -g monitor-activity off
set-option -g visual-activity off

# terminal title
set-option -g set-titles on
set-option -g set-titles-string '#h · #W' # Show hostname and window name in terminal title

# splitting panes like in vim
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# moving between panes like in vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Quick window selection
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Basic styling
set-option -g status-left-length 50 # Default is 10, which truncates longer hostnames
set-option -g status-left ' #h/#S  '
set-option -g status-left-style 'bold,reverse'
set-option -g status-right '#{?pane_mode, #[bold reverse] #{pane_mode} ,}#{?client_prefix, #[bold reverse] PREFIX ,}'
set-option -g window-status-format ' #{?#{||:#{window_bell_flag},#{window_marked_flag}},●, } #W#{?window_zoomed_flag, [Z],}   ' # Dot marks bells or a marked pane; bell clears when visited
set-option -g window-status-current-format ' #{?window_marked_flag,●, } #W#{?window_zoomed_flag, [Z],}   ' # Keep the marked-pane dot visible in the current window
set-option -g window-status-current-style 'bold,reverse'
set-option -g automatic-rename on
set-option -g pane-border-lines heavy
set-option -g status-interval 0

# Vi mode
set-option -g mode-keys vi
unbind-key [
bind-key Escape copy-mode
bind-key C-k copy-mode

# Copy & paste vi style
unbind-key p
bind-key p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# move x clipboard into tmux paste buffer
bind-key C-p run "xclip -o | tmux load-buffer - ; tmux paste-buffer"

# move tmux copy buffer into x clipboard
bind-key y run "tmux save-buffer - | xclip -i"

# Move current window with [ and ]
bind-key -r ] swap-window -t +1 \; select-window -t +1
bind-key -r [ swap-window -t -1 \; select-window -t -1

# when pressing page-up, enter copy-mode and go up one page
bind-key -T root PPage if-shell -F "#{alternate_on}" "send-keys PPage" "copy-mode -e; send-keys PPage"

# mouse support
set-option -g mouse on

# Emit an explicit clipboard selector for when using tmux over a Mosh connection,
# otherwise yanking from nvim or other apps in tmux doesn't reach the host's clipboard.
# Mosh advertises itself as 'xterm' (contrary to 'alacritty' which is set when over SSH)
# so this change is mostly Mosh-specific. (I don't use xterm anyway)
# To be removed if one day Mosh supports tmux’s default sequence that it sents when yanking.
set -s 'terminal-overrides[100]' 'xterm*:Ms=\E]52;%p1%sc;%p2%s\a'

# Optionaly load a companion local configuration file.
# Useful to set e.g. different colors on each machine I ssh into.
# Typically only contains these two lines (with a different chosen color):
# set -g status-style 'bg=cyan,fg=black'
# set -g pane-active-border-style 'fg=cyan'
source-file -q ~/.tmux.local.conf
