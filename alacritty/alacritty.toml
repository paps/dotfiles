[general]
import = [
    "~/.paps/alacritty/ghostty_default.toml"
]

[font]
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { family = "JetBrains Mono", style = "Bold" }
italic = { family = "JetBrains Mono", style = "Italic" }

# Make Shift+Enter insert a newline by sending LF (a.k.a. Ctrl+J),
# which makes certain programs (like Codex) insert a new line instead of the
# normal 'Enter' key behavior.
# Applies globally, in most places (zsh, vim...) Ctrl+J is handled correctly
# as well.
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u000a"
